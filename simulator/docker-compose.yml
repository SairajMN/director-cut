services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  control-api:
    build:
      context: .
    command: uvicorn control_api.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push

  encoder-1:
    build:
      context: .
    command: python -u workers/encoder.py encoder-1
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
    depends_on:
      - control-api

  encoder-2:
    build:
      context: .
    command: python -u workers/encoder.py encoder-2
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
    depends_on:
      - control-api

  encoder-3:
    build:
      context: .
    command: python -u workers/encoder.py encoder-3
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
    depends_on:
      - control-api

  cdn-1:
    build:
      context: .
    command: python -u workers/cdn.py cdn-1
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
    depends_on:
      - control-api

  cdn-2:
    build:
      context: .
    command: python -u workers/cdn.py cdn-2
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
    depends_on:
      - control-api
